    <style>
      :root {
        --navy: #0b1f3a;
        --navy-2: #1b4f8a;
        --amber: #f1652a;
        --frost: #f7f9fc;
        --ice: #7ec8e3;
        --dim: rgba(6, 12, 24, 0.62);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--navy);
      }
      body {
        font-family: Inter, system-ui, sans-serif;
        color: var(--frost);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--navy);
      }
      .sky {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 80% 50% at 50% 0%, #1b4f8a 0%, transparent 58%),
          linear-gradient(180deg, #071525 0%, #0b1f3a 42%, #102844 100%);
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .wordmark-row {
        position: absolute;
        top: 72px;
        left: 80px;
        right: 80px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 8;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 28px;
      }
      .wordmark-sun {
        width: 24px;
        height: 24px;
        flex: 0 0 auto;
      }
      .wordmark-name {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #fff;
        line-height: 1;
      }
      .live-pill {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ice);
        opacity: 0.9;
      }
      #zoom-outer {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      #zoom-inner {
        position: absolute;
        inset: 0;
        will-change: transform;
      }
      .tilt-card {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 880px;
        height: 1480px;
        margin-left: -440px;
        margin-top: -700px;
        border-radius: 28px;
        overflow: hidden;
        background: #e8eef4;
        box-shadow: 36px 28px 80px rgba(0, 0, 0, 0.48);
        transform-style: preserve-3d;
      }
      .page-content {
        position: absolute;
        top: 0;
        left: 0;
        width: 880px;
        will-change: transform;
      }
      .page-content img {
        display: block;
        width: 880px;
        height: auto;
      }
      .page-marker {
        position: absolute;
        pointer-events: none;
      }
      #cal-target {
        top: 15.7%;
        left: 5%;
        width: 90%;
        height: 40%;
      }
      #week-target {
        top: 37.5%;
        left: 4%;
        width: 92%;
        height: 9%;
      }
      #graph-target {
        top: 58.2%;
        left: 5%;
        width: 90%;
        height: 18.5%;
      }
      .yt-hl {
        --yt-hl-x: 50%;
        --yt-hl-y: 42%;
        --yt-hl-rx: 46%;
        --yt-hl-ry: 28%;
        --yt-hl-dim: 0.55;
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: rgba(6, 8, 12, var(--yt-hl-dim));
        -webkit-mask-image: radial-gradient(
          ellipse var(--yt-hl-rx) var(--yt-hl-ry) at var(--yt-hl-x) var(--yt-hl-y),
          transparent 0%,
          transparent 52%,
          black 88%
        );
        mask-image: radial-gradient(
          ellipse var(--yt-hl-rx) var(--yt-hl-ry) at var(--yt-hl-x) var(--yt-hl-y),
          transparent 0%,
          transparent 52%,
          black 88%
        );
      }
      .wipe {
        position: absolute;
        display: block;
        border: 3px solid var(--amber);
        border-radius: 16px;
        transform-origin: left center;
        pointer-events: none;
        box-shadow: 0 0 0 1px rgba(240, 85, 20, 0.25);
      }
      #wipe-cal {
        top: 37.5%;
        left: 4%;
        width: 92%;
        height: 9%;
      }
      .callout {
        position: absolute;
        left: 80px;
        z-index: 9;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 920px;
      }
      #call-cal {
        top: 168px;
      }
      #call-graph {
        top: 168px;
      }
      .callout-kicker {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #ffb089;
        text-shadow: 0 2px 14px rgba(7, 21, 37, 0.95), 0 0 28px rgba(7, 21, 37, 0.85);
      }
      .callout-title {

        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.05;
        text-shadow: 0 2px 18px rgba(7, 21, 37, 0.92);
      }
      .lockup {
        position: absolute;
        left: 80px;
        right: 80px;
        bottom: 120px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .lockup-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 36px;
      }
      .lockup-logo .wordmark-sun {
        width: 30px;
        height: 30px;
      }
      .lockup-logo .wordmark-name {
        font-size: 28px;
      }
      .lockup-place {
        font-size: 72px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 0.95;
      }
      .lockup-month {
        font-size: 40px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ice);
      }
      .lockup-line {
        width: 120px;
        height: 4px;
        background: var(--amber);
        border-radius: 2px;
        display: block;
      }
      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 7;
        background: radial-gradient(ellipse 70% 60% at 50% 45%, transparent 40%, rgba(5, 12, 24, 0.55) 100%);
      }
    </style>
  </head>
  <body>

    <script>
      (function () {
        function ytHighlightIn(tl, target, at, opts) {
          opts = opts || {};
          gsap.set(target, {
            "--yt-hl-x": opts.x !== undefined ? opts.x : "50%",
            "--yt-hl-y": opts.y !== undefined ? opts.y : "50%",
            "--yt-hl-rx": opts.rx !== undefined ? opts.rx : "22%",
            "--yt-hl-ry": opts.ry !== undefined ? opts.ry : "26%",
          });
          tl.to(target, { opacity: 1, duration: 0.5, ease: "power2.out" }, at);
        }
        function ytHighlightTo(tl, target, at, opts, dur) {
          opts = opts || {};
          var vars = { duration: dur === undefined ? 0.8 : dur, ease: "power2.inOut" };
          if (opts.x !== undefined) vars["--yt-hl-x"] = opts.x;
          if (opts.y !== undefined) vars["--yt-hl-y"] = opts.y;
          if (opts.rx !== undefined) vars["--yt-hl-rx"] = opts.rx;
          if (opts.ry !== undefined) vars["--yt-hl-ry"] = opts.ry;
          tl.to(target, vars, at);
        }
        function ytHighlightOut(tl, target, at) {
          tl.to(target, { opacity: 0, duration: 0.4, ease: "power2.in" }, at);
        }

        function build() {
          var W = 1080;
          var H = 1920;
          var page = document.getElementById("page-content");
          var week = document.getElementById("week-target");
          var SCROLL_WEEK = -640;
          gsap.set("#tilt-card", { rotationY: 0, rotationX: 0, transformPerspective: 1400 });
          gsap.set(page, { y: SCROLL_WEEK });
          var r = week.getBoundingClientRect();
          var originX = ((r.left + r.width / 2) / W) * 100;
          var originY = ((r.top + r.height / 2) / H) * 100;
          var maxScale = Math.min((0.9 * W) / r.width, (0.55 * H) / r.height);
          var zoomScale = Math.min(2.35, maxScale);
          gsap.set(page, { y: 0 });
          gsap.set("#zoom-outer", { transformOrigin: originX + "% " + originY + "%" });

          gsap.set("#tilt-card", {
            rotationY: -6,
            rotationX: 4,
            transformPerspective: 1400,
            force3D: true,
          });
          gsap.set("#wipe-cal", { scaleX: 0, autoAlpha: 0 });
          gsap.set("#call-cal", { autoAlpha: 0, y: 18 });
          gsap.set("#call-graph", { autoAlpha: 0, y: 18 });
          gsap.set("#lockup", { autoAlpha: 0, y: 28 });
          gsap.set("#lockup-line", { scaleX: 0, transformOrigin: "left center" });
          gsap.set("#top-bar", { autoAlpha: 0, y: -16 });
          gsap.set("#page-hl", { opacity: 0 });
          gsap.set("#page-content", { y: -180 });

          var tl = gsap.timeline({ paused: true });

          tl.fromTo(
            "#tilt-card",
            { autoAlpha: 0, scale: 0.9 },
            { autoAlpha: 1, scale: 1, duration: 0.7, ease: "power3.out" },
            0.05,
          );
          tl.fromTo(
            "#top-bar",
            { autoAlpha: 0, y: -16 },
            { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" },
            0.15,
          );

          tl.to("#page-content", { y: SCROLL_WEEK, duration: 1.7, ease: "power3.out" }, 0.35);

          tl.fromTo(
            "#wipe-cal",
            { scaleX: 0, autoAlpha: 0 },
            { scaleX: 1, autoAlpha: 1, duration: 0.55, ease: "power3.out" },
            2.2,
          );
          ytHighlightIn(tl, "#page-hl", 2.25, { x: "50%", y: "48%", rx: "52%", ry: "14%" });
          tl.fromTo(
            "#call-cal",
            { autoAlpha: 0, y: 18 },
            { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out" },
            2.4,
          );

          tl.to("#call-cal", { autoAlpha: 0, y: -10, duration: 0.3, ease: "power2.in" }, 4.85);
          tl.fromTo(
            "#call-graph",
            { autoAlpha: 0, y: 18 },
            { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out" },
            5.15,
          );
          ytHighlightTo(tl, "#page-hl", 5.2, { x: "50%", y: "48%", rx: "54%", ry: "12%" }, 0.8);

          tl.to("#zoom-outer", { scale: zoomScale, duration: 1.35, ease: "power3.inOut" }, 6.2);
          tl.to("#tilt-card", { rotationY: 0, rotationX: 0, scale: 1, duration: 1.35, ease: "power3.inOut" }, 6.2);

          tl.to("#call-graph", { autoAlpha: 0, duration: 0.35, ease: "power2.in" }, 6.05);
          tl.to("#top-bar", { autoAlpha: 0, duration: 0.35, ease: "power2.in" }, 8.35);
          tl.to("#wipe-cal", { autoAlpha: 0, duration: 0.3, ease: "power1.in" }, 8.35);
          ytHighlightOut(tl, "#page-hl", 8.35);
          tl.to("#tilt-card", { autoAlpha: 0.28, duration: 0.5, ease: "power2.out" }, 8.5);
          tl.fromTo(
            "#lockup",
            { autoAlpha: 0, y: 28 },
            { autoAlpha: 1, y: 0, duration: 0.55, ease: "power3.out" },
            8.6,
          );
          tl.fromTo(
            "#lockup-line",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.4, ease: "power2.out" },
            8.8,
          );

          tl.seek(0);
          window.__timelines["main"] = tl;
          if (typeof window.__hfForceTimelineRebind === "function") {
            window.__hfForceTimelineRebind();
          }
        }

        var img = document.querySelector("#page-content img");
        var ready = [];
        if (document.fonts && document.fonts.ready) ready.push(document.fonts.ready);
        if (img && img.decode) ready.push(img.decode().catch(function () {}));
        Promise.all(ready).then(build);
      })();
    </script>
